name: 26.3-Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - "26.3"
    paths:
      - 'src/main/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/wrapper/**'
      - '.github/workflows/**'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "26.3"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'microsoft'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 第三方兼容用的 jar 不随仓库分发（都是别人发布的构建产物），构建前按固定版本下载并校验
      - name: Download compat jars
        run: |
          mkdir -p libs
          curl -fsSL -o libs/create-fly-26.3-6.0.9-2.jar \
            https://github.com/ZurrTum/Create-Fly/releases/download/v6.0.9-26.3-2/create-fly-26.3-6.0.9-2.jar
          echo "016b7a33a634b1964460d30c81f57aab9b4beae78673f1729f653cee3673e09e  libs/create-fly-26.3-6.0.9-2.jar" | sha256sum -c -

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Create timestamp
        id: create_timestamp
        run: echo "timestamp=$(date '+%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Send file to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 26.3-snapshot-${{ steps.create_timestamp.outputs.timestamp }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message || 'manual dispatch' }}
          draft: false
          prerelease: true
          files: ./build/libs/*.jar

      - name: Cleanup Gradle Cache
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
